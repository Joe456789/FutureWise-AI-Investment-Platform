<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>帳號設定 - FutureWise AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; background-color: #000000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #ffffff; }
        .app-container { width: 100%; max-width: 414px; height: 100vh; max-height: 896px; background-color: #121212; position: relative; display: flex; flex-direction: column; box-shadow: 0 0 20px rgba(255, 255, 255, 0.05); overflow: hidden; }
        .header { padding: 10px 20px; background-color: #1e1e1e; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; height: 60px; }
        .header .back-btn { color: #a0a0a0; text-decoration: none; display: flex; align-items: center; gap: 5px; font-size: 16px; width: 60px; }
        .header-title { font-size: 18px; font-weight: bold; color: #e2e8f0; text-align: center; flex: 1; }
        .header-placeholder { width: 60px; }
        .content { flex: 1; overflow-y: auto; padding: 20px 25px; }

        .section-title { font-size: 13px; color: #94a3b8; margin: 20px 0 10px 0; text-transform: uppercase; letter-spacing: 1px; }
        .section-title:first-child { margin-top: 0; }

        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; margin-bottom: 6px; font-size: 13px; color: #cbd5e1; }
        .input-group input {
            width: 100%; padding: 12px; border: 1px solid #333; background: #1e1e1e;
            border-radius: 8px; color: white; box-sizing: border-box; outline: none;
        }
        .input-group input:focus { border-color: #38bdf8; }

        .save-btn {
            width: 100%; padding: 14px; background: linear-gradient(135deg, #0ea5e9, #2563eb);
            border: none; border-radius: 8px; color: white; font-size: 15px; font-weight: bold;
            cursor: pointer; margin-top: 10px;
        }
        .save-btn.secondary { background: linear-gradient(135deg, #4b5563, #374151); }
        .save-btn:active { transform: scale(0.98); }

        .divider { border: none; border-top: 1px solid #2a2a2a; margin: 25px 0; }

        .toast { position: fixed; bottom: 30px; left: 50%; background: #1e1e1e; border: 1px solid #38bdf8; color: #e2e8f0; padding: 10px 20px; border-radius: 20px; font-size: 13px; opacity: 0; pointer-events: none; z-index: 50; transform: translateX(-50%) translateY(16px) scale(0.9); transition: opacity 0.25s ease, transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
            .rip-btn { position: relative; overflow: hidden; }
        .rip-ink { position: absolute; border-radius: 50%; background: rgba(255,255,255,0.35); pointer-events: none; transform: scale(0); opacity: 0.6; transition: transform 0.55s ease, opacity 0.55s ease; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <a href="profile.html" class="back-btn"><i class="fas fa-chevron-left"></i> 返回</a>
            <div class="header-title">帳號設定</div>
            <div class="header-placeholder"></div>
        </div>

        <div class="content">
            <div class="section-title">基本資料</div>
            <div class="input-group">
                <label for="set-email">Email（帳號，無法修改）</label>
                <input type="email" id="set-email" disabled>
            </div>
            <div class="input-group">
                <label for="set-name">姓名</label>
                <input type="text" id="set-name" placeholder="您的姓名">
            </div>
            <div class="input-group">
                <label for="set-phone">聯絡電話</label>
                <input type="tel" id="set-phone" placeholder="聯絡電話">
            </div>
            <button class="save-btn rip-btn" onclick="saveProfile()">儲存變更</button>

            <hr class="divider">

            <div class="section-title">變更密碼</div>
            <div class="input-group">
                <label for="set-old-pw">舊密碼</label>
                <input type="password" id="set-old-pw" placeholder="請輸入目前密碼">
            </div>
            <div class="input-group">
                <label for="set-new-pw">新密碼</label>
                <input type="password" id="set-new-pw" placeholder="請設定新密碼">
            </div>
            <button class="save-btn secondary" onclick="changePassword()">更新密碼</button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const API_BASE_URL = "https://128gzb5evxna.shares.zrok.io";

        // --- Zrok 攔截頁繞過 + JWT Auth Interceptor ---
        const originalFetch = window.fetch;
        window.fetch = async function() {
            let [resource, config] = arguments;
            if(typeof resource === 'string' && resource.includes(API_BASE_URL)) {
                config = config || {};
                config.headers = config.headers || {};
                config.headers['skip_zrok_interstitial'] = 'true';
                const token = localStorage.getItem('access_token');
                if (token) {
                    config.headers['Authorization'] = 'Bearer ' + token;
                }
            }
            return originalFetch(resource, config);
        };
        // -----------------------------
        const token = localStorage.getItem('access_token');

        if (!token) {
            window.location.href = 'login.html';
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2500);
        }

        async function loadProfile() {
            try {
                const res = await fetch(`${API_BASE_URL}/api/user/me`, {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (res.status === 401) {
                    localStorage.removeItem('access_token');
                    window.location.href = 'login.html';
                    return;
                }
                const data = await res.json();
                document.getElementById('set-email').value = data.email || '';
                document.getElementById('set-name').value = data.name || '';
                document.getElementById('set-phone').value = data.phone || '';
            } catch (err) {
                console.error(err);
                showToast('載入失敗，請檢查網路連線');
            }
        }

        async function saveProfile() {
            const name = document.getElementById('set-name').value.trim();
            const phone = document.getElementById('set-phone').value.trim();
            try {
                const res = await fetch(`${API_BASE_URL}/api/user/me`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({ name: name, phone: phone })
                });
                if (!res.ok) throw new Error('更新失敗');
                showToast('資料已更新');
            } catch (err) {
                console.error(err);
                showToast('更新失敗，請稍後再試');
            }
        }

        async function changePassword() {
            const oldPw = document.getElementById('set-old-pw').value;
            const newPw = document.getElementById('set-new-pw').value;
            if (!oldPw || !newPw) {
                showToast('請輸入舊密碼與新密碼');
                return;
            }
            try {
                const res = await fetch(`${API_BASE_URL}/api/user/password`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({ old_password: oldPw, new_password: newPw })
                });
                const result = await res.json();
                if (!res.ok) {
                    showToast(result.detail || '密碼更新失敗');
                    return;
                }
                showToast('密碼已更新');
                document.getElementById('set-old-pw').value = '';
                document.getElementById('set-new-pw').value = '';
            } catch (err) {
                console.error(err);
                showToast('更新失敗，請稍後再試');
            }
        }

        loadProfile();
    </script>
    <script>
        document.addEventListener('click', function(e) {
            const btn = e.target.closest('.rip-btn');
            if (!btn) return;
            const rect = btn.getBoundingClientRect();
            const size = Math.max(rect.width, rect.height) * 2;
            const ink = document.createElement('span');
            ink.className = 'rip-ink';
            ink.style.width = ink.style.height = size + 'px';
            ink.style.left = (e.clientX - rect.left - size / 2) + 'px';
            ink.style.top = (e.clientY - rect.top - size / 2) + 'px';
            btn.appendChild(ink);
            requestAnimationFrame(() => { ink.style.transform = 'scale(1)'; ink.style.opacity = '0'; });
            setTimeout(() => ink.remove(), 600);
        });
    </script>
</body>
</html>
