<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>幫助與客服 - FutureWise AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 設計語彙（跟dashboard.html同一套shadcn/ui風格token，統一全站視覺質感） */
        :root {
            --sc-radius: 0.75rem;
            --sc-card-bg: #17181c;
            --sc-card-border: rgba(255,255,255,0.08);
            --sc-muted-fg: #94a3b8;
            --sc-up: #ef4444;   /* 台股慣例：紅漲 */
            --sc-down: #22c55e; /* 台股慣例：綠跌 */
        }

        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; background-color: #000000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #ffffff; }
        .app-container { width: 100%; max-width: 414px; height: 100vh; max-height: 896px; background-color: #121212; position: relative; display: flex; flex-direction: column; box-shadow: 0 0 20px rgba(255, 255, 255, 0.05); overflow: hidden; }
        .header { padding: 10px 20px; background-color: #1e1e1e; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; height: 60px; }
        .header .back-btn { color: #a0a0a0; text-decoration: none; display: flex; align-items: center; gap: 5px; font-size: 16px; width: 60px; }
        .header-title { font-size: 18px; font-weight: bold; color: #e2e8f0; text-align: center; flex: 1; }
        .header-placeholder { width: 60px; }
        .content { flex: 1; overflow-y: auto; padding: 20px 25px; }

        .section-title { font-size: 13px; color: #94a3b8; margin: 20px 0 10px 0; text-transform: uppercase; letter-spacing: 1px; }
        .section-title:first-child { margin-top: 0; }

        .faq-item { background: var(--sc-card-bg); border: 1px solid var(--sc-card-border); border-radius: var(--sc-radius); margin-bottom: 10px; overflow: hidden; }
        .faq-question { padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-size: 14px; color: #e2e8f0; }
        .faq-answer { max-height: 0; overflow: hidden; transition: 0.25s ease; font-size: 13px; color: #999; line-height: 1.6; }
        .faq-answer-inner { padding: 0 16px 14px 16px; }
        .faq-item.open .faq-answer { max-height: 200px; }
        .faq-item.open .faq-chevron { transform: rotate(180deg); }
        .faq-chevron { transition: 0.25s; color: #555; }

        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; margin-bottom: 6px; font-size: 13px; color: #cbd5e1; }
        .input-group input, .input-group textarea {
            width: 100%; padding: 12px; border: 1px solid #333; background: #1e1e1e;
            border-radius: 8px; color: white; box-sizing: border-box; outline: none; font-family: inherit;
        }
        .input-group textarea { resize: vertical; min-height: 90px; }
        .input-group input:focus, .input-group textarea:focus { border-color: #38bdf8; }

        .send-btn {
            width: 100%; padding: 14px; background: linear-gradient(135deg, #0ea5e9, #2563eb);
            border: none; border-radius: 8px; color: white; font-size: 15px; font-weight: bold;
            cursor: pointer; margin-top: 5px;
        }

        .toast { position: fixed; bottom: 30px; left: 50%; background: #1e1e1e; border: 1px solid #38bdf8; color: #e2e8f0; padding: 10px 20px; border-radius: 20px; font-size: 13px; opacity: 0; pointer-events: none; z-index: 50; text-align: center; transform: translateX(-50%) translateY(16px) scale(0.9); transition: opacity 0.25s ease, transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
            .rip-btn { position: relative; overflow: hidden; }
        .rip-ink { position: absolute; border-radius: 50%; background: rgba(255,255,255,0.35); pointer-events: none; transform: scale(0); opacity: 0.6; transition: transform 0.55s ease, opacity 0.55s ease; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <a href="profile.html" class="back-btn"><i class="fas fa-chevron-left"></i> 返回</a>
            <div class="header-title">幫助與客服</div>
            <div class="header-placeholder"></div>
        </div>

        <div class="content">
            <div class="section-title">常見問題</div>

            <div class="faq-item">
                <div class="faq-question" onclick="toggleFaq(this)">
                    AI 預測結果準確嗎？<i class="fas fa-chevron-down faq-chevron"></i>
                </div>
                <div class="faq-answer"><div class="faq-answer-inner">模型以歷史資料回測，方向預測<span id="faqHitRate">準確率請至AI分析頁查看即時勝率</span>，僅供研究與參考，不構成投資建議，請自行評估風險。</div></div>
            </div>

            <div class="faq-item">
                <div class="faq-question" onclick="toggleFaq(this)">
                    為什麼收藏或歷史紀錄讀不到？<i class="fas fa-chevron-down faq-chevron"></i>
                </div>
                <div class="faq-answer"><div class="faq-answer-inner">請確認已登入帳號，且網路連線正常。若持續無法讀取，可嘗試登出後重新登入。</div></div>
            </div>

            <div class="faq-item">
                <div class="faq-question" onclick="toggleFaq(this)">
                    如何重設密碼？<i class="fas fa-chevron-down faq-chevron"></i>
                </div>
                <div class="faq-answer"><div class="faq-answer-inner">登入後可至「帳號設定」變更密碼。若忘記密碼，請透過下方表單聯絡我們協助處理。</div></div>
            </div>

            <div class="section-title">聯絡我們</div>
            <div class="input-group">
                <label for="sup-subject">主旨</label>
                <input type="text" id="sup-subject" placeholder="請簡短描述問題">
            </div>
            <div class="input-group">
                <label for="sup-message">詳細內容</label>
                <textarea id="sup-message" placeholder="請詳細描述您遇到的問題..."></textarea>
            </div>
            <button class="send-btn rip-btn" onclick="submitTicket(this)">送出</button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const API_BASE_URL = "https://128gzb5evxna.shares.zrok.io";

        // --- Zrok 攔截頁繞過 + JWT Auth Interceptor ---
        const originalFetch = window.fetch;
        window.fetch = async function() {
            let [resource, config] = arguments;
            if(typeof resource === 'string' && resource.includes(API_BASE_URL)) {
                config = config || {};
                config.headers = config.headers || {};
                config.headers['skip_zrok_interstitial'] = 'true';
                const token = localStorage.getItem('access_token');
                if (token) {
                    config.headers['Authorization'] = 'Bearer ' + token;
                }
            }
            const __resp = await originalFetch(resource, config);
            if (__resp.status === 403 && typeof resource === 'string' && resource.includes(API_BASE_URL)) {
                __resp.clone().json().then(b => { if (b && b.detail && b.detail.code === 'CONSENT_REQUIRED') window.location.href = 'consent.html?required=1'; }).catch(() => {});
            }
            return __resp;
        };
        // -----------------------------
        const token = localStorage.getItem('access_token');

        function toggleFaq(el) {
            el.parentElement.classList.toggle('open');
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2500);
        }

        // 近30天模型勝率，用來取代 FAQ 裡寫死的準確率數字
        async function loadFaqHitRate() {
            try {
                const res = await fetch(`${API_BASE_URL}/api/prediction_accuracy?days=30`);
                const d = await res.json();
                const el = document.getElementById('faqHitRate');
                if (!el) return;
                if (d.hit_rate === null || d.hit_rate === undefined) return;
                el.innerText = `準確率約 ${d.hit_rate}%`;
            } catch (error) {
                console.error('FAQ 模型勝率讀取失敗:', error);
            }
        }

        async function submitTicket(btn) {
            if (!token) {
                showToast('請先登入才能送出問題');
                setTimeout(() => window.location.href = 'login.html', 1200);
                return;
            }
            const subject = document.getElementById('sup-subject').value.trim();
            const message = document.getElementById('sup-message').value.trim();
            if (!subject || !message) {
                showToast('請填寫主旨與內容');
                return;
            }
            const originalText = btn ? btn.innerText : '';
            if (btn) {
                btn.disabled = true;
                btn.innerText = '送出中...';
            }
            try {
                const res = await fetch(`${API_BASE_URL}/api/support`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({ subject: subject, message: message })
                });
                const result = await res.json();
                if (!res.ok) throw new Error(result.detail || '送出失敗');
                showToast('已收到您的問題，我們會盡快回覆');
                document.getElementById('sup-subject').value = '';
                document.getElementById('sup-message').value = '';
            } catch (err) {
                console.error(err);
                showToast('送出失敗，請稍後再試');
            } finally {
                if (btn) {
                    btn.disabled = false;
                    btn.innerText = originalText;
                }
            }
        }

        loadFaqHitRate();
    </script>
    <script>
        document.addEventListener('click', function(e) {
            const btn = e.target.closest('.rip-btn');
            if (!btn) return;
            const rect = btn.getBoundingClientRect();
            const size = Math.max(rect.width, rect.height) * 2;
            const ink = document.createElement('span');
            ink.className = 'rip-ink';
            ink.style.width = ink.style.height = size + 'px';
            ink.style.left = (e.clientX - rect.left - size / 2) + 'px';
            ink.style.top = (e.clientY - rect.top - size / 2) + 'px';
            btn.appendChild(ink);
            requestAnimationFrame(() => { ink.style.transform = 'scale(1)'; ink.style.opacity = '0'; });
            setTimeout(() => ink.remove(), 600);
        });
    </script>
</body>
</html>
