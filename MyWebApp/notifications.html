<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>通知管理 - ProQuant AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; background-color: #000000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #ffffff; }
        .app-container { width: 100%; max-width: 414px; height: 100vh; max-height: 896px; background-color: #121212; position: relative; display: flex; flex-direction: column; box-shadow: 0 0 20px rgba(255, 255, 255, 0.05); overflow: hidden; }
        .header { padding: 10px 20px; background-color: #1e1e1e; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; height: 60px; }
        .header .back-btn { color: #a0a0a0; text-decoration: none; display: flex; align-items: center; gap: 5px; font-size: 16px; width: 60px; }
        .header-title { font-size: 18px; font-weight: bold; color: #e2e8f0; text-align: center; flex: 1; }
        .header-placeholder { width: 60px; }
        .content { flex: 1; overflow-y: auto; padding: 20px 25px; }

        .notice-banner { background: rgba(56, 189, 248, 0.08); border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 10px; padding: 12px 14px; font-size: 12px; color: #93c5fd; margin-bottom: 20px; display: flex; gap: 10px; align-items: flex-start; }
        .notice-banner i { margin-top: 2px; }

        .toggle-row { display: flex; justify-content: space-between; align-items: center; background-color: #1e1e1e; border: 1px solid #2a2a2a; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
        .toggle-info { display: flex; flex-direction: column; gap: 4px; }
        .toggle-title { font-size: 15px; color: #e2e8f0; font-weight: bold; }
        .toggle-desc { font-size: 12px; color: #94a3b8; }

        .switch { position: relative; display: inline-block; width: 46px; height: 26px; flex-shrink: 0; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #333; transition: .3s; border-radius: 26px; }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: #38bdf8; }
        input:checked + .slider:before { transform: translateX(20px); }

        .toast { position: fixed; bottom: 30px; left: 50%; background: #1e1e1e; border: 1px solid #38bdf8; color: #e2e8f0; padding: 10px 20px; border-radius: 20px; font-size: 13px; opacity: 0; pointer-events: none; z-index: 50; transform: translateX(-50%) translateY(16px) scale(0.9); transition: opacity 0.25s ease, transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
            .rip-btn { position: relative; overflow: hidden; }
        .rip-ink { position: absolute; border-radius: 50%; background: rgba(255,255,255,0.35); pointer-events: none; transform: scale(0); opacity: 0.6; transition: transform 0.55s ease, opacity 0.55s ease; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <a href="profile.html" class="back-btn"><i class="fas fa-chevron-left"></i> 返回</a>
            <div class="header-title">通知管理</div>
            <div class="header-placeholder"></div>
        </div>

        <div class="content">
            <div class="notice-banner">
                <i class="fas fa-circle-info"></i>
                <span>目前這裡僅為 App 內的通知偏好設定，尚未串接手機推播通知，您的選擇會影響社群等頁面未來是否顯示相關提示。</span>
            </div>

            <div class="toggle-row">
                <div class="toggle-info">
                    <div class="toggle-title">AI 預測提醒</div>
                    <div class="toggle-desc">收藏股票有新的預測結果時通知我</div>
                </div>
                <label class="switch">
                    <input type="checkbox" id="toggle-ai" onchange="saveSettings()">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="toggle-row">
                <div class="toggle-info">
                    <div class="toggle-title">社群回覆通知</div>
                    <div class="toggle-desc">有人回覆或按讚我的貼文時通知我</div>
                </div>
                <label class="switch">
                    <input type="checkbox" id="toggle-community" onchange="saveSettings()">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="toggle-row">
                <div class="toggle-info">
                    <div class="toggle-title">系統公告</div>
                    <div class="toggle-desc">重大更新或維護公告</div>
                </div>
                <label class="switch">
                    <input type="checkbox" id="toggle-system" onchange="saveSettings()">
                    <span class="slider"></span>
                </label>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const API_BASE_URL = "https://128gzb5evxna.shares.zrok.io";

        // --- Zrok 攔截頁繞過 + JWT Auth Interceptor ---
        const originalFetch = window.fetch;
        window.fetch = async function() {
            let [resource, config] = arguments;
            if(typeof resource === 'string' && resource.includes(API_BASE_URL)) {
                config = config || {};
                config.headers = config.headers || {};
                config.headers['skip_zrok_interstitial'] = 'true';
                const token = localStorage.getItem('access_token');
                if (token) {
                    config.headers['Authorization'] = 'Bearer ' + token;
                }
            }
            return originalFetch(resource, config);
        };
        // -----------------------------
        const token = localStorage.getItem('access_token');

        if (!token) {
            window.location.href = 'login.html';
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2000);
        }

        async function loadSettings() {
            try {
                const res = await fetch(`${API_BASE_URL}/api/notifications/settings`, {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (res.status === 401) {
                    localStorage.removeItem('access_token');
                    window.location.href = 'login.html';
                    return;
                }
                const data = await res.json();
                document.getElementById('toggle-ai').checked = !!data.ai_alert;
                document.getElementById('toggle-community').checked = !!data.community_reply;
                document.getElementById('toggle-system').checked = !!data.system_announce;
            } catch (err) {
                console.error(err);
                showToast('載入失敗，請檢查網路連線');
            }
        }

        async function saveSettings() {
            const payload = {
                ai_alert: document.getElementById('toggle-ai').checked,
                community_reply: document.getElementById('toggle-community').checked,
                system_announce: document.getElementById('toggle-system').checked
            };
            try {
                await fetch(`${API_BASE_URL}/api/notifications/settings`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify(payload)
                });
                showToast('已儲存');
            } catch (err) {
                console.error(err);
                showToast('儲存失敗，請稍後再試');
            }
        }

        loadSettings();
    </script>
    <script>
        document.addEventListener('click', function(e) {
            const btn = e.target.closest('.rip-btn');
            if (!btn) return;
            const rect = btn.getBoundingClientRect();
            const size = Math.max(rect.width, rect.height) * 2;
            const ink = document.createElement('span');
            ink.className = 'rip-ink';
            ink.style.width = ink.style.height = size + 'px';
            ink.style.left = (e.clientX - rect.left - size / 2) + 'px';
            ink.style.top = (e.clientY - rect.top - size / 2) + 'px';
            btn.appendChild(ink);
            requestAnimationFrame(() => { ink.style.transform = 'scale(1)'; ink.style.opacity = '0'; });
            setTimeout(() => ink.remove(), 600);
        });
    </script>
</body>
</html>
