<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FutureWise AI 股市預測系統 - 註冊</title>
    
    <style>
        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            position: relative;
            overflow: hidden; 
        }

        .bg-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            transform: scaleX(-1);
            z-index: 1;
        }

        .register-container {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            padding: 30px 40px;
            border-radius: 15px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: min(350px, calc(100% - 40px)); /* 固定350px在較窄手機寬度(如375px)會被left:10%擠出畫面外，改成不超過視窗寬度 */
            box-sizing: border-box;
            color: white;
            text-align: center;
            position: absolute;
            top: 5%;
            left: 10%;
            z-index: 10;
            max-height: 90vh;
            overflow-y: auto;
        }

        .consent-section { text-align: left; margin: 18px 0 6px; }
        .consent-title { font-size: 14px; color: #e2e8f0; font-weight: bold; margin-bottom: 4px; }
        .consent-hint { font-size: 12px; color: #94a3b8; margin-bottom: 10px; line-height: 1.5; }
        .consent-item { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
        .consent-row { display: flex; gap: 10px; align-items: flex-start; }
        .consent-row input[type=checkbox] { width: 18px; height: 18px; margin-top: 2px; flex-shrink: 0; accent-color: #38bdf8; cursor: pointer; }
        .consent-label { font-size: 13px; color: #e2e8f0; line-height: 1.4; cursor: pointer; }
        .consent-summary { font-size: 12px; color: #94a3b8; margin-top: 2px; }
        .consent-tag { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 999px; margin-right: 6px; font-weight: 600; }
        .consent-tag.req { background: rgba(239,68,68,0.15); color: #f87171; }
        .consent-tag.opt { background: rgba(148,163,184,0.15); color: #94a3b8; }
        .consent-toggle { font-size: 12px; color: #38bdf8; cursor: pointer; background: none; border: none; padding: 4px 0 0 28px; }
        .consent-body { display: none; margin: 8px 0 0 28px; padding: 10px; max-height: 180px; overflow-y: auto; background: rgba(0,0,0,0.3); border-radius: 8px; font-size: 12px; color: #cbd5e1; line-height: 1.7; white-space: pre-wrap; }
        .consent-body.open { display: block; }
        .success-panel { text-align: left; font-size: 14px; line-height: 1.7; color: #cbd5e1; }
        .success-panel b { color: #38bdf8; }

        .register-container h2 {
            margin-bottom: 5px;
            font-size: 26px;
            letter-spacing: 1px;
            color: #38bdf8;
            text-transform: uppercase;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: #cbd5e1;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #475569;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            color: white;
            box-sizing: border-box;
            outline: none;
        }
        /* 密碼欄位右側「顯示/隱藏密碼」眼睛按鈕 */
        .pw-wrap { position: relative; }
        .pw-wrap input[type="password"], .pw-wrap input[type="text"].pw-input { padding-right: 42px; }
        .pw-toggle { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); background: none; border: none; padding: 6px; cursor: pointer; color: #94a3b8; display: flex; align-items: center; }
        .pw-toggle:hover { color: #cbd5e1; }
        .pw-toggle svg { width: 18px; height: 18px; display: block; }
        .pw-toggle .eye-closed { display: none; }


        .register-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #10b981, #059669);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .register-btn:disabled { opacity: 0.7; cursor: not-allowed; }

        .back-link {
            margin-top: 20px;
            font-size: 14px;
        }

        .back-link a {
            color: #94a3b8;
            text-decoration: none;
        }
            .rip-btn { position: relative; overflow: hidden; }
        .rip-ink { position: absolute; border-radius: 50%; background: rgba(255,255,255,0.35); pointer-events: none; transform: scale(0); opacity: 0.6; transition: transform 0.55s ease, opacity 0.55s ease; }

        .toast { position: fixed; bottom: 30px; left: 50%; background: #1e1e1e; border: 1px solid #38bdf8; color: #e2e8f0; padding: 10px 20px; border-radius: 20px; font-size: 13px; opacity: 0; pointer-events: none; z-index: 50; transform: translateX(-50%) translateY(16px) scale(0.9); transition: opacity 0.25s ease, transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
    </style>
</head>
<body>
    <div class="bg-wrapper"></div>

    <div class="register-container">
        <h2>建立帳號</h2>
        <p>請填寫基本資料完成註冊</p>

        <div id="successPanel" class="success-panel" style="display:none;"></div>

        <form id="registerForm">
            <div class="input-group">
                <label for="reg-username">Email (登入信箱)</label>
                <input type="text" id="reg-username" placeholder="驗證信與重設密碼信會寄到這裡" required>
            </div>
            <div class="input-group">
                <label for="reg-password">Password (設定密碼)</label>
                <div class="pw-wrap"><input type="password" id="reg-password" placeholder="請設定密碼" required><button type="button" class="pw-toggle" tabindex="-1" aria-label="顯示密碼" onclick="togglePw('reg-password', this)"><svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg><svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg></button></div>
            </div>
            <div class="input-group">
                <label for="reg-password-confirm">Confirm Password (確認密碼)</label>
                <div class="pw-wrap"><input type="password" id="reg-password-confirm" placeholder="請再次輸入密碼" required><button type="button" class="pw-toggle" tabindex="-1" aria-label="顯示密碼" onclick="togglePw('reg-password-confirm', this)"><svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg><svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg></button></div>
            </div>
            <div class="input-group">
                <label for="reg-name">Full Name (姓名)</label>
                <input type="text" id="reg-name" placeholder="您的真實姓名" required>
            </div>
            <div class="input-group">
                <label for="reg-phone">Phone (聯絡電話)</label>
                <input type="tel" id="reg-phone" placeholder="客服聯繫用" required>
            </div>

            <div class="consent-section">
                <div class="consent-title">同意條款與資料授權</div>
                <div class="consent-hint">請逐項閱讀並勾選。標示「必填」的項目為使用本服務所必須；「選填」的項目不同意也不影響使用，之後可隨時在個人頁面的「隱私與資料授權」修改。</div>
                <div id="consentList"><div class="consent-hint">條款載入中...</div></div>
            </div>

            <button type="button" class="register-btn rip-btn" id="registerBtn" onclick="handleRegister()" disabled>完成註冊</button>

            <div class="back-link">
                <a href="login.html">← 返回登入頁面</a>
            </div>
        </form>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const API_BASE_URL = "https://128gzb5evxna.shares.zrok.io";

        // --- Zrok 攔截頁繞過 + JWT Auth Interceptor ---
        const originalFetch = window.fetch;
        window.fetch = async function() {
            let [resource, config] = arguments;
            if(typeof resource === 'string' && resource.includes(API_BASE_URL)) {
                config = config || {};
                config.headers = config.headers || {};
                config.headers['skip_zrok_interstitial'] = 'true';
                const token = localStorage.getItem('access_token');
                if (token) {
                    config.headers['Authorization'] = 'Bearer ' + token;
                }
            }
            return originalFetch(resource, config);
        };
        // -----------------------------


        // 密碼欄位右側的「顯示/隱藏密碼」眼睛按鈕
        function togglePw(inputId, btn) {
            const input = document.getElementById(inputId);
            const show = input.type === 'password';
            input.type = show ? 'text' : 'password';
            input.classList.toggle('pw-input', show);
            btn.querySelector('.eye-open').style.display = show ? 'none' : '';
            btn.querySelector('.eye-closed').style.display = show ? '' : 'none';
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2500);
        }

        function handleRegister() {
            const username = document.getElementById('reg-username').value;
            const pass = document.getElementById('reg-password').value;
            const passConfirm = document.getElementById('reg-password-confirm').value;
            const name = document.getElementById('reg-name').value;
            const phone = document.getElementById('reg-phone').value;
            const btn = document.getElementById('registerBtn');

            if (!username) {
                showToast('請輸入電子郵件');
                return;
            }
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailPattern.test(username)) {
                showToast('請輸入正確的Email格式');
                return;
            }
            if (!pass) {
                showToast('請輸入密碼');
                return;
            }
            if (pass.length < 6) {
                showToast('密碼長度至少需要6碼');
                return;
            }
            if (!passConfirm) {
                showToast('請再次輸入密碼');
                return;
            }
            if (pass !== passConfirm) {
                showToast('兩次輸入的密碼不一致');
                return;
            }
            if (!name) {
                showToast('請輸入姓名');
                return;
            }
            if (!phone) {
                showToast('請輸入聯絡電話');
                return;
            }

            if (!consentItems.length) {
                showToast('條款尚未載入完成，請重新整理頁面');
                return;
            }
            const consents = consentItems.map(item => ({
                code: item.code,
                version: item.version,
                granted: document.getElementById('consent-' + item.code).checked
            }));

            const originalBtnText = btn.innerText;
            btn.disabled = true;
            btn.innerText = '註冊中...';

            fetch(API_BASE_URL + '/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: username, password: pass, name: name, phone: phone, consents: consents })
            })
            .then(res => res.json().then(data => ({status: res.status, body: data})))
            .then(result => {
                if (result.status === 200) {
                    showRegisterSuccess(username, result.body.verification_required);
                } else {
                    const detail = result.body.detail;
                    showToast('註冊失敗：' + (typeof detail === 'string' ? detail : '發生錯誤'));
                    btn.disabled = false;
                    btn.innerText = originalBtnText;
                    updateRegisterBtn();
                }
            })
            .catch(err => {
                console.error(err);
                showToast('連線伺服器失敗，請稍後再試。');
                btn.disabled = false;
                btn.innerText = originalBtnText;
                updateRegisterBtn();
            });
        }

        function showRegisterSuccess(email, verificationRequired) {
            document.getElementById('registerForm').style.display = 'none';
            const panel = document.getElementById('successPanel');
            const p1 = document.createElement('p');
            const p2 = document.createElement('p');
            if (verificationRequired) {
                p1.append('驗證信已寄到 ');
                const b = document.createElement('b');
                b.textContent = email;
                p1.append(b, '，請點擊信中的連結完成驗證後再登入。');
                p2.textContent = '沒收到的話請檢查垃圾郵件匣；也可以回登入頁重新寄送。';
            } else {
                p1.textContent = '註冊成功，現在可以登入了。';
            }
            const back = document.createElement('div');
            back.className = 'back-link';
            back.innerHTML = '<a href="login.html">前往登入頁面 →</a>';
            panel.append(p1, p2, back);
            panel.style.display = 'block';
        }

        // 條款由後端動態提供（資料庫可升版），每一項獨立勾選，不做「一鍵全同意」的綑綁同意
        let consentItems = [];

        function updateRegisterBtn() {
            const btn = document.getElementById('registerBtn');
            if (!consentItems.length) { btn.disabled = true; return; }
            btn.disabled = !consentItems.filter(i => i.required)
                .every(i => document.getElementById('consent-' + i.code).checked);
        }

        async function loadConsentItems() {
            const box = document.getElementById('consentList');
            try {
                const res = await fetch(API_BASE_URL + '/api/consent/items');
                if (!res.ok) throw new Error('載入失敗');
                consentItems = (await res.json()).items || [];
                box.innerHTML = '';
                consentItems.forEach(item => {
                    const wrap = document.createElement('div');
                    wrap.className = 'consent-item';

                    const row = document.createElement('div');
                    row.className = 'consent-row';
                    const cb = document.createElement('input');
                    cb.type = 'checkbox';
                    cb.id = 'consent-' + item.code;
                    cb.addEventListener('change', updateRegisterBtn);
                    const label = document.createElement('label');
                    label.className = 'consent-label';
                    label.htmlFor = cb.id;
                    const tag = document.createElement('span');
                    tag.className = 'consent-tag ' + (item.required ? 'req' : 'opt');
                    tag.textContent = item.required ? '必填' : '選填';
                    const title = document.createElement('span');
                    title.textContent = item.title;
                    const summary = document.createElement('div');
                    summary.className = 'consent-summary';
                    summary.textContent = item.summary || '';
                    label.append(tag, title, summary);
                    row.append(cb, label);

                    const toggle = document.createElement('button');
                    toggle.type = 'button';
                    toggle.className = 'consent-toggle';
                    toggle.textContent = '查看全文';
                    const body = document.createElement('div');
                    body.className = 'consent-body';
                    body.textContent = item.body;
                    toggle.addEventListener('click', () => {
                        const open = body.classList.toggle('open');
                        toggle.textContent = open ? '收合全文' : '查看全文';
                    });

                    wrap.append(row, toggle, body);
                    box.appendChild(wrap);
                });
                updateRegisterBtn();
            } catch (err) {
                console.error(err);
                box.innerHTML = '<div class="consent-hint" style="color:#f87171;">條款載入失敗，請重新整理頁面再試一次。</div>';
            }
        }

        loadConsentItems();

    </script>
    <script>
        document.addEventListener('click', function(e) {
            const btn = e.target.closest('.rip-btn');
            if (!btn) return;
            const rect = btn.getBoundingClientRect();
            const size = Math.max(rect.width, rect.height) * 2;
            const ink = document.createElement('span');
            ink.className = 'rip-ink';
            ink.style.width = ink.style.height = size + 'px';
            ink.style.left = (e.clientX - rect.left - size / 2) + 'px';
            ink.style.top = (e.clientY - rect.top - size / 2) + 'px';
            btn.appendChild(ink);
            requestAnimationFrame(() => { ink.style.transform = 'scale(1)'; ink.style.opacity = '0'; });
            setTimeout(() => ink.remove(), 600);
        });
    </script>
</body>
</html>
