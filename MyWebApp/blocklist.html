<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>封鎖名單 - FutureWise AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 設計語彙（跟dashboard.html同一套shadcn/ui風格token，統一全站視覺質感） */
        :root {
            --sc-radius: 0.75rem;
            --sc-card-bg: #17181c;
            --sc-card-border: rgba(255,255,255,0.08);
            --sc-muted-fg: #94a3b8;
            --sc-up: #ef4444;   /* 台股慣例：紅漲 */
            --sc-down: #22c55e; /* 台股慣例：綠跌 */
        }
        .sc-badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; line-height: 1.4; white-space: nowrap; }
        .sc-badge-up { background: rgba(239, 68, 68, 0.12); color: var(--sc-up); }
        .sc-badge-down { background: rgba(34, 197, 94, 0.12); color: var(--sc-down); }
        .sc-badge-neutral { background: rgba(148, 163, 184, 0.12); color: var(--sc-muted-fg); }

        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; background-color: #000000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #ffffff; }
        .app-container { width: 100%; max-width: 414px; height: 100vh; max-height: 896px; background-color: #121212; position: relative; display: flex; flex-direction: column; box-shadow: 0 0 20px rgba(255, 255, 255, 0.05); overflow: hidden; }
        .header { padding: 10px 20px; background-color: #1e1e1e; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; height: 60px; }
        .header .back-btn { color: #a0a0a0; text-decoration: none; display: flex; align-items: center; gap: 5px; font-size: 16px; width: 60px; }
        .header-title { font-size: 18px; font-weight: bold; color: #e2e8f0; text-align: center; flex: 1; }
        .header-placeholder { width: 60px; }
        .content { flex: 1; overflow-y: auto; padding: 20px 25px; }

        .section-title { font-size: 15px; font-weight: bold; color: #94a3b8; margin: 0 0 12px 0; display: flex; align-items: center; gap: 8px; }
        .section-hint { font-size: 12px; color: #64748b; margin: -6px 0 16px; }

        .block-card { background: var(--sc-card-bg); border: 1px solid var(--sc-card-border); border-radius: var(--sc-radius); padding: 14px 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .block-email { font-size: 13px; color: #e2e8f0; display: flex; align-items: center; gap: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .block-email i { color: #64748b; }
        .unblock-btn { background-color: rgba(56, 189, 248, 0.1); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 8px; padding: 6px 12px; font-size: 12px; cursor: pointer; flex-shrink: 0; margin-left: 8px; }

        .empty-state { text-align: center; color: #94a3b8; margin: 40px 0; }
        .empty-state i { font-size: 32px; margin-bottom: 12px; color: #333; display: block; }

        @keyframes skeleton-pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
        .skeleton-block { background-color: #2a2a2a; border-radius: 6px; animation: skeleton-pulse 1.4s ease-in-out infinite; }
        .skeleton-stock-card { background-color: #1e1e1e; border-radius: 12px; padding: 15px; margin-bottom: 12px; border: 1px solid #2a2a2a; }

        .rip-btn { position: relative; overflow: hidden; }
        .rip-ink { position: absolute; border-radius: 50%; background: rgba(255,255,255,0.35); pointer-events: none; transform: scale(0); opacity: 0.6; transition: transform 0.55s ease, opacity 0.55s ease; }

        .toast { position: fixed; bottom: 30px; left: 50%; background: #1e1e1e; border: 1px solid #38bdf8; color: #e2e8f0; padding: 10px 20px; border-radius: 20px; font-size: 13px; opacity: 0; pointer-events: none; z-index: 50; transform: translateX(-50%) translateY(16px) scale(0.9); transition: opacity 0.25s ease, transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <a href="profile.html" class="back-btn"><i class="fas fa-chevron-left"></i> 返回</a>
            <div class="header-title">封鎖名單</div>
            <div class="header-placeholder"></div>
        </div>

        <div class="content">
            <div class="section-title"><i class="fas fa-user-slash"></i> 已封鎖的使用者</div>
            <div class="section-hint">被封鎖的使用者的貼文與留言將不會顯示在社群頁面</div>
            <div id="blockList">
                <div class="skeleton-stock-card"><div class="skeleton-block" style="height:16px; width:50%;"></div></div>
                <div class="skeleton-stock-card"><div class="skeleton-block" style="height:16px; width:40%;"></div></div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const API_BASE_URL = "https://128gzb5evxna.shares.zrok.io";

        // --- 防止儲存型XSS：所有使用者輸入的文字，放進HTML之前一律先跳脫 ---
        function escHtml(v) {
            return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        // --- Zrok 攔截頁繞過 + JWT Auth Interceptor ---
        const originalFetch = window.fetch;
        window.fetch = async function() {
            let [resource, config] = arguments;
            if(typeof resource === 'string' && resource.includes(API_BASE_URL)) {
                config = config || {};
                config.headers = config.headers || {};
                config.headers['skip_zrok_interstitial'] = 'true';
                const token = localStorage.getItem('access_token');
                if (token) {
                    config.headers['Authorization'] = 'Bearer ' + token;
                }
            }
            const response = await originalFetch(resource, config);
            if (response.status === 403 && typeof resource === 'string' && resource.includes(API_BASE_URL)) {
                response.clone().json().then(b => { if (b && b.detail && b.detail.code === 'CONSENT_REQUIRED') window.location.href = 'consent.html?required=1'; }).catch(() => {});
            }
            if (response.status === 401) {
                localStorage.removeItem('access_token');
                window.location.href = 'login.html';
            }
            return response;
        };
        // -----------------------------

        if (!localStorage.getItem('access_token')) {
            window.location.href = 'login.html';
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2500);
        }

        async function loadBlockList() {
            const container = document.getElementById('blockList');
            try {
                const res = await fetch(`${API_BASE_URL}/api/blocks`);
                if (!res.ok) throw new Error('載入失敗');
                const data = await res.json();
                const blocked = data.blocked || [];

                if (blocked.length === 0) {
                    container.innerHTML = `<div class="empty-state"><i class="fas fa-user-check"></i>目前沒有封鎖任何人</div>`;
                    return;
                }

                container.innerHTML = blocked.map(email => `
                    <div class="block-card">
                        <div class="block-email"><i class="fas fa-user"></i>${escHtml(email)}</div>
                        <button class="unblock-btn rip-btn" data-email="${escHtml(email)}" onclick="unblock(this.dataset.email, this)">解除封鎖</button>
                    </div>
                `).join('');
            } catch (error) {
                container.innerHTML = `<div class="empty-state"><i class="fas fa-triangle-exclamation"></i>載入失敗，請重新整理再試一次</div>`;
            }
        }

        async function unblock(email, btn) {
            btn.disabled = true;
            try {
                const res = await fetch(`${API_BASE_URL}/api/blocks/${encodeURIComponent(email)}`, { method: 'DELETE' });
                if (!res.ok) throw new Error('解除封鎖失敗');
                showToast('已解除封鎖');
                loadBlockList();
            } catch (error) {
                showToast('解除封鎖失敗，請稍後再試');
                btn.disabled = false;
            }
        }

        loadBlockList();
    </script>
    <script>
        document.addEventListener('click', function(e) {
            const btn = e.target.closest('.rip-btn');
            if (!btn) return;
            const rect = btn.getBoundingClientRect();
            const size = Math.max(rect.width, rect.height) * 2;
            const ink = document.createElement('span');
            ink.className = 'rip-ink';
            ink.style.width = ink.style.height = size + 'px';
            ink.style.left = (e.clientX - rect.left - size / 2) + 'px';
            ink.style.top = (e.clientY - rect.top - size / 2) + 'px';
            btn.appendChild(ink);
            requestAnimationFrame(() => { ink.style.transform = 'scale(1)'; ink.style.opacity = '0'; });
            setTimeout(() => ink.remove(), 600);
        });
    </script>
</body>
</html>
