<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FutureWise AI 股市預測系統 - 登入</title>
    
    <link rel="manifest" href="manifest.json">
    
    <style>
        /* 基礎設定 */
        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            position: relative;
            overflow: hidden; 
        }

        .bg-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            transform: scaleX(-1);
            z-index: 1;
        }

        .login-container {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: min(350px, calc(100% - 40px)); /* 固定350px在較窄手機寬度(如375px)會被left:10%擠出畫面外，改成不超過視窗寬度 */
            box-sizing: border-box;
            color: white;
            text-align: center;
            position: absolute;
            top: 10%;
            left: 10%;  
            z-index: 10; 
            transition: 0.3s;
        }

        /* 忘記密碼的小彈窗樣式 */
        #forgot-panel {
            display: none; /* 預設隱藏 */
        }

        .login-container h2 {
            margin-bottom: 5px;
            font-size: 26px;
            letter-spacing: 1px;
            color: #38bdf8;
            text-transform: uppercase;
        }

        .login-container p {
            margin-bottom: 30px;
            font-size: 14px;
            color: #94a3b8;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #cbd5e1;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #475569;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            color: white;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
            background: rgba(255, 255, 255, 0.1);
        }
        /* 密碼欄位右側「顯示/隱藏密碼」眼睛按鈕 */
        .pw-wrap { position: relative; }
        .pw-wrap input[type="password"], .pw-wrap input[type="text"].pw-input { padding-right: 42px; }
        .pw-toggle { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); background: none; border: none; padding: 6px; cursor: pointer; color: #94a3b8; display: flex; align-items: center; }
        .pw-toggle:hover { color: #cbd5e1; }
        .pw-toggle svg { width: 18px; height: 18px; display: block; }
        .pw-toggle .eye-closed { display: none; }


        .login-btn, .reset-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #0ea5e9, #2563eb);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .reset-btn {
            background: linear-gradient(135deg, #f59e0b, #d97706);
        }

        .login-btn:hover, .reset-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
        }

        .link-group {
            margin-top: 20px;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
        }

        .link-group a {
            color: #38bdf8;
            text-decoration: none;
            transition: 0.3s;
        }

        .link-group a:hover {
            color: white;
            text-decoration: underline;
        }
            .rip-btn { position: relative; overflow: hidden; }
        .rip-ink { position: absolute; border-radius: 50%; background: rgba(255,255,255,0.35); pointer-events: none; transform: scale(0); opacity: 0.6; transition: transform 0.55s ease, opacity 0.55s ease; }
        .login-btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none !important; }

        .toast { position: fixed; bottom: 30px; left: 50%; background: #1e1e1e; border: 1px solid #38bdf8; color: #e2e8f0; padding: 10px 20px; border-radius: 20px; font-size: 13px; opacity: 0; pointer-events: none; z-index: 50; transform: translateX(-50%) translateY(16px) scale(0.9); transition: opacity 0.25s ease, transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
    </style>
</head>
<body>

    <div class="bg-wrapper"></div>

    <div class="login-container" id="login-panel">
        <h2>FutureWise AI</h2>
        <p>量化分析與股市預測系統</p>

        <form>
            <div class="input-group">
                <label for="username">User ID (帳號)</label>
                <input type="text" id="username" placeholder="請輸入帳號" required>
            </div>
            <div class="input-group">
                <label for="password">Password (密碼)</label>
                <div class="pw-wrap"><input type="password" id="password" placeholder="請輸入密碼" required onkeydown="if(event.key === 'Enter'){ event.preventDefault(); handleLogin(); }"><button type="button" class="pw-toggle" tabindex="-1" aria-label="顯示密碼" onclick="togglePw('password', this)"><svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg><svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg></button></div>
            </div>
            <button type="button" class="login-btn rip-btn" id="loginBtn" onclick="handleLogin()">System Login</button>

            <div id="unverifiedBox" style="display:none; margin-top:14px; padding:10px 12px; border-radius:8px; background:rgba(245,158,11,0.12); border:1px solid rgba(245,158,11,0.4); font-size:13px; color:#fcd34d; text-align:left; line-height:1.6;">
                這個 Email 還沒完成驗證，請先到信箱點擊驗證連結。
                <a href="javascript:void(0)" onclick="resendVerification()" style="color:#38bdf8;">沒收到？重新寄送驗證信</a>
            </div>

            <div class="link-group">
                <a href="javascript:void(0)" onclick="toggleForgot(true)">忘記密碼？</a>
                <a href="register.html">立即註冊帳號</a>
            </div>
        </form>
    </div>

    <div class="login-container" id="forgot-panel">
        <h2>重設密碼</h2>
        <p style="line-height: 1.6; margin-bottom: 20px;">請輸入註冊時使用的 Email，我們會寄一封重設密碼的連結給你。</p>

        <form onsubmit="return false;">
            <div class="input-group">
                <label for="forgot-email">Email</label>
                <input type="text" id="forgot-email" placeholder="請輸入註冊 Email" onkeydown="if(event.key === 'Enter'){ event.preventDefault(); handleForgot(); }">
            </div>
            <button type="button" class="reset-btn rip-btn" id="forgotBtn" onclick="handleForgot()">寄送重設連結</button>
        </form>

        <div class="link-group" style="justify-content: center;">
            <a href="javascript:void(0)" onclick="toggleForgot(false)" style="color: #94a3b8;">← 返回登入</a>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const API_BASE_URL = "https://128gzb5evxna.shares.zrok.io";

        // --- Zrok 攔截頁繞過 + JWT Auth Interceptor ---
        const originalFetch = window.fetch;
        window.fetch = async function() {
            let [resource, config] = arguments;
            if(typeof resource === 'string' && resource.includes(API_BASE_URL)) {
                config = config || {};
                config.headers = config.headers || {};
                config.headers['skip_zrok_interstitial'] = 'true';
                const token = localStorage.getItem('access_token');
                if (token) {
                    config.headers['Authorization'] = 'Bearer ' + token;
                }
            }
            return originalFetch(resource, config);
        };
        // -----------------------------


        // 密碼欄位右側的「顯示/隱藏密碼」眼睛按鈕
        function togglePw(inputId, btn) {
            const input = document.getElementById(inputId);
            const show = input.type === 'password';
            input.type = show ? 'text' : 'password';
            input.classList.toggle('pw-input', show);
            btn.querySelector('.eye-open').style.display = show ? 'none' : '';
            btn.querySelector('.eye-closed').style.display = show ? '' : 'none';
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2500);
        }

        // 切換面板顯示
        function toggleForgot(show) {
            document.getElementById('login-panel').style.display = show ? 'none' : 'block';
            document.getElementById('forgot-panel').style.display = show ? 'block' : 'none';
        }

        // 忘記密碼：伺服器不論Email存不存在都回一樣的訊息（避免被拿來探測誰註冊過），所以這裡也只顯示通用提示
        async function postAuth(path, payload) {
            const res = await fetch(API_BASE_URL + path, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const body = await res.json().catch(() => ({}));
            return { ok: res.ok, status: res.status, body };
        }

        async function handleForgot() {
            const email = document.getElementById('forgot-email').value.trim();
            const btn = document.getElementById('forgotBtn');
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                showToast('請輸入正確的Email格式');
                return;
            }
            btn.disabled = true;
            try {
                const r = await postAuth('/api/auth/forgot_password', { email });
                showToast(r.ok ? r.body.message : (typeof r.body.detail === 'string' ? r.body.detail : '送出失敗，請稍後再試'));
            } catch (err) {
                console.error(err);
                showToast('連線伺服器失敗，請稍後再試。');
            } finally {
                btn.disabled = false;
            }
        }

        async function resendVerification() {
            const email = document.getElementById('username').value.trim();
            try {
                const r = await postAuth('/api/auth/resend_verification', { email });
                showToast(r.ok ? r.body.message : (typeof r.body.detail === 'string' ? r.body.detail : '送出失敗，請稍後再試'));
            } catch (err) {
                console.error(err);
                showToast('連線伺服器失敗，請稍後再試。');
            }
        }

        // 登入邏輯
        function handleLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');

            if(!user || !pass) {
                showToast('請輸入帳號和密碼！');
                return;
            }

            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailPattern.test(user)) {
                showToast('請輸入正確的Email格式');
                return;
            }

            const originalBtnText = btn.innerText;
            btn.disabled = true;
            btn.innerText = '登入中...';

            fetch(API_BASE_URL + '/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: user, password: pass })
            })
            .then(res => res.json().then(data => ({status: res.status, body: data})))
            .then(result => {
                document.getElementById('unverifiedBox').style.display = 'none';
                if(result.status === 200) {
                    localStorage.setItem('access_token', result.body.access_token);
                    showToast('登入成功！');
                    // 有新版必要條款還沒同意的話，先去同意頁，同意完才進系統
                    const next = result.body.consent_required ? 'consent.html?required=1' : 'dashboard.html';
                    setTimeout(() => { window.location.href = next; }, 800);
                } else if (result.status === 403 && result.body.detail && result.body.detail.code === 'EMAIL_NOT_VERIFIED') {
                    document.getElementById('unverifiedBox').style.display = 'block';
                } else {
                    const detail = result.body.detail;
                    showToast('登入失敗：' + (typeof detail === 'string' ? detail : '帳號或密碼錯誤'));
                }
            })
            .catch(err => {
                console.error(err);
                showToast('連線伺服器失敗，請稍後再試。');
            })
            .finally(() => {
                btn.disabled = false;
                btn.innerText = originalBtnText;
            });
        }

    </script>
    <script>
        document.addEventListener('click', function(e) {
            const btn = e.target.closest('.rip-btn');
            if (!btn) return;
            const rect = btn.getBoundingClientRect();
            const size = Math.max(rect.width, rect.height) * 2;
            const ink = document.createElement('span');
            ink.className = 'rip-ink';
            ink.style.width = ink.style.height = size + 'px';
            ink.style.left = (e.clientX - rect.left - size / 2) + 'px';
            ink.style.top = (e.clientY - rect.top - size / 2) + 'px';
            btn.appendChild(ink);
            requestAnimationFrame(() => { ink.style.transform = 'scale(1)'; ink.style.opacity = '0'; });
            setTimeout(() => ink.remove(), 600);
        });
    </script>
</body>
</html>
