<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProQuant AI 股市預測系統 - 登入</title>
    
    <link rel="manifest" href="manifest.json">
    
    <style>
        /* 基礎設定 */
        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            position: relative;
            overflow: hidden; 
        }

        .bg-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            transform: scaleX(-1);
            z-index: 1;
        }

        .login-container {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 350px;
            color: white;
            text-align: center;
            position: absolute;
            top: 10%;   
            left: 10%;  
            z-index: 10; 
            transition: 0.3s;
        }

        /* 忘記密碼的小彈窗樣式 */
        #forgot-panel {
            display: none; /* 預設隱藏 */
        }

        .login-container h2 {
            margin-bottom: 5px;
            font-size: 26px;
            letter-spacing: 1px;
            color: #38bdf8;
            text-transform: uppercase;
        }

        .login-container p {
            margin-bottom: 30px;
            font-size: 14px;
            color: #94a3b8;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #cbd5e1;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #475569;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            color: white;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
            background: rgba(255, 255, 255, 0.1);
        }

        .login-btn, .reset-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #0ea5e9, #2563eb);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .reset-btn {
            background: linear-gradient(135deg, #f59e0b, #d97706);
        }

        .login-btn:hover, .reset-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
        }

        .link-group {
            margin-top: 20px;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
        }

        .link-group a {
            color: #38bdf8;
            text-decoration: none;
            transition: 0.3s;
        }

        .link-group a:hover {
            color: white;
            text-decoration: underline;
        }
            .rip-btn { position: relative; overflow: hidden; }
        .rip-ink { position: absolute; border-radius: 50%; background: rgba(255,255,255,0.35); pointer-events: none; transform: scale(0); opacity: 0.6; transition: transform 0.55s ease, opacity 0.55s ease; }
    </style>
</head>
<body>

    <div class="bg-wrapper"></div>

    <div class="login-container" id="login-panel">
        <h2>ProQuant AI</h2>
        <p>量化分析與股市預測系統</p>

        <form>
            <div class="input-group">
                <label for="username">User ID (帳號)</label>
                <input type="text" id="username" placeholder="請輸入帳號" required>
            </div>
            <div class="input-group">
                <label for="password">Password (密碼)</label>
                <input type="password" id="password" placeholder="請輸入密碼" required>
            </div>
            <button type="button" class="login-btn rip-btn" onclick="handleLogin()">System Login</button>
            
            <div class="link-group">
                <a href="javascript:void(0)" onclick="toggleForgot(true)">忘記密碼？</a>
                <a href="register.html">立即註冊帳號</a>
            </div>
        </form>
    </div>

    <div class="login-container" id="forgot-panel">
        <h2>重設密碼</h2>
        <p style="line-height: 1.6;">自動找回密碼功能尚在開發中，如忘記密碼，請透過其他管道聯繫系統管理員協助處理。</p>

        <div class="link-group" style="justify-content: center;">
            <a href="javascript:void(0)" onclick="toggleForgot(false)" style="color: #94a3b8;">← 返回登入</a>
        </div>
    </div>

    <script>
        // 切換面板顯示
        function toggleForgot(show) {
            document.getElementById('login-panel').style.display = show ? 'none' : 'block';
            document.getElementById('forgot-panel').style.display = show ? 'block' : 'none';
        }

        // 登入邏輯
        function handleLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            if(!user || !pass) {
                alert('請輸入帳號和密碼！');
                return;
            }

            const API_BASE_URL = "https://128gzb5evxna.shares.zrok.io";

        // --- Zrok 攔截頁繞過 + JWT Auth Interceptor ---
        const originalFetch = window.fetch;
        window.fetch = async function() {
            let [resource, config] = arguments;
            if(typeof resource === 'string' && resource.includes(API_BASE_URL)) {
                config = config || {};
                config.headers = config.headers || {};
                config.headers['skip_zrok_interstitial'] = 'true';
                const token = localStorage.getItem('access_token');
                if (token) {
                    config.headers['Authorization'] = 'Bearer ' + token;
                }
            }
            return originalFetch(resource, config);
        };
        // -----------------------------

            fetch(API_BASE_URL + '/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: user, password: pass })
            })
            .then(res => res.json().then(data => ({status: res.status, body: data})))
            .then(result => {
                if(result.status === 200) {
                    localStorage.setItem('access_token', result.body.access_token);
                    alert('登入成功！');
                    window.location.href = 'dashboard.html'; 
                } else {
                    alert('登入失敗：' + (result.body.detail || '帳號或密碼錯誤'));
                }
            })
            .catch(err => {
                console.error(err);
                alert('連線伺服器失敗，請稍後再試。');
            });
        }
        
    </script>
    <script>
        document.addEventListener('click', function(e) {
            const btn = e.target.closest('.rip-btn');
            if (!btn) return;
            const rect = btn.getBoundingClientRect();
            const size = Math.max(rect.width, rect.height) * 2;
            const ink = document.createElement('span');
            ink.className = 'rip-ink';
            ink.style.width = ink.style.height = size + 'px';
            ink.style.left = (e.clientX - rect.left - size / 2) + 'px';
            ink.style.top = (e.clientY - rect.top - size / 2) + 'px';
            btn.appendChild(ink);
            requestAnimationFrame(() => { ink.style.transform = 'scale(1)'; ink.style.opacity = '0'; });
            setTimeout(() => ink.remove(), 600);
        });
    </script>
</body>
</html>
