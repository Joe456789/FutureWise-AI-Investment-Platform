<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>歷史紀錄 - FutureWise AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; background-color: #000000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #ffffff; }
        .app-container { width: 100%; max-width: 414px; height: 100vh; max-height: 896px; background-color: #121212; position: relative; display: flex; flex-direction: column; box-shadow: 0 0 20px rgba(255, 255, 255, 0.05); overflow: hidden; }
        .header { padding: 10px 20px; background-color: #1e1e1e; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; height: 60px; }
        .header .back-btn { color: #a0a0a0; text-decoration: none; display: flex; align-items: center; gap: 5px; font-size: 16px; width: 60px; }
        .header-title { font-size: 18px; font-weight: bold; color: #e2e8f0; text-align: center; flex: 1; }
        .header-placeholder { width: 60px; }
        .content { flex: 1; overflow-y: auto; padding: 20px 25px; }

        .history-item { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid #2a2a2a; cursor: pointer; }
        .history-item:active { background-color: #1a1a1a; }
        .history-icon { width: 38px; height: 38px; border-radius: 10px; background: rgba(56, 189, 248, 0.1); color: #38bdf8; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .history-main { flex: 1; display: flex; flex-direction: column; gap: 2px; }
        .history-ticker { font-size: 15px; font-weight: bold; color: #e2e8f0; }
        .history-time { font-size: 12px; color: #94a3b8; }

        .empty-state { text-align: center; color: #94a3b8; margin-top: 80px; }
        .empty-state i { font-size: 40px; margin-bottom: 15px; color: #333; }
            .rip-btn { position: relative; overflow: hidden; }
        .rip-ink { position: absolute; border-radius: 50%; background: rgba(255,255,255,0.35); pointer-events: none; transform: scale(0); opacity: 0.6; transition: transform 0.55s ease, opacity 0.55s ease; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <a href="profile.html" class="back-btn"><i class="fas fa-chevron-left"></i> 返回</a>
            <div class="header-title">歷史紀錄</div>
            <div class="header-placeholder"></div>
        </div>

        <div class="content" id="historyList">
            <div class="empty-state"><i class="fas fa-spinner fa-spin"></i><div>載入中...</div></div>
        </div>
    </div>

    <script>
        const API_BASE_URL = "https://128gzb5evxna.shares.zrok.io";

        // --- Zrok 攔截頁繞過 + JWT Auth Interceptor ---
        const originalFetch = window.fetch;
        window.fetch = async function() {
            let [resource, config] = arguments;
            if(typeof resource === 'string' && resource.includes(API_BASE_URL)) {
                config = config || {};
                config.headers = config.headers || {};
                config.headers['skip_zrok_interstitial'] = 'true';
                const token = localStorage.getItem('access_token');
                if (token) {
                    config.headers['Authorization'] = 'Bearer ' + token;
                }
            }
            return originalFetch(resource, config);
        };
        // -----------------------------
        const token = localStorage.getItem('access_token');

        if (!token) {
            window.location.href = 'login.html';
        }

        function formatTime(isoStr) {
            if (!isoStr) return '';
            const d = new Date(isoStr);
            return d.toLocaleString('zh-TW', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
        }

        async function loadHistory() {
            const listEl = document.getElementById('historyList');
            try {
                const res = await fetch(`${API_BASE_URL}/api/history`, {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (res.status === 401) {
                    localStorage.removeItem('access_token');
                    window.location.href = 'login.html';
                    return;
                }
                const data = await res.json();

                if (!data.length) {
                    listEl.innerHTML = `<div class="empty-state"><i class="fas fa-clock-rotate-left"></i><div>還沒有查詢紀錄，去「AI分析」頁看幾檔股票吧</div></div>`;
                    return;
                }

                listEl.innerHTML = data.map(item => `
                    <div class="history-item" onclick="window.location.href='ai_analysis.html?ticker=${item.ticker}'">
                        <div class="history-icon"><i class="fas fa-chart-line"></i></div>
                        <div class="history-main">
                            <div class="history-ticker">${item.stock_name || ''} (${item.ticker})</div>
                            <div class="history-time">${formatTime(item.viewed_at)}</div>
                        </div>
                        <i class="fas fa-chevron-right" style="color:#555; font-size:12px;"></i>
                    </div>
                `).join('');
            } catch (err) {
                console.error(err);
                listEl.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><div>載入失敗，請檢查網路連線</div></div>`;
            }
        }

        loadHistory();
    </script>
    <script>
        document.addEventListener('click', function(e) {
            const btn = e.target.closest('.rip-btn');
            if (!btn) return;
            const rect = btn.getBoundingClientRect();
            const size = Math.max(rect.width, rect.height) * 2;
            const ink = document.createElement('span');
            ink.className = 'rip-ink';
            ink.style.width = ink.style.height = size + 'px';
            ink.style.left = (e.clientX - rect.left - size / 2) + 'px';
            ink.style.top = (e.clientY - rect.top - size / 2) + 'px';
            btn.appendChild(ink);
            requestAnimationFrame(() => { ink.style.transform = 'scale(1)'; ink.style.opacity = '0'; });
            setTimeout(() => ink.remove(), 600);
        });
    </script>
</body>
</html>
